<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vellur Spun Pipes | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        :root {
            --primary-blue: #0052D4;
            --primary-red: #eb3349;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #1a2a6c, #0d47a1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .landing-container {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .landing-container:hover {
            transform: translateY(-5px);
        }

        .logo-box {
            margin-bottom: 1.5rem;
            color: var(--primary-blue);
        }

        h1 {
            color: #1a2a6c;
            font-weight: 700;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: -1px;
        }

        p {
            color: #64748b;
            margin: 0.5rem 0 2.5rem 0;
            font-size: 1rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .btn-portal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 1rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            font-size: 0.95rem;
        }

        .btn-admin {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            box-shadow: 0 4px 15px rgba(235, 51, 73, 0.3);
        }

        .btn-customer {
            background: linear-gradient(135deg, #0052D4 0%, #4364F7 100%);
            box-shadow: 0 4px 15px rgba(0, 82, 212, 0.3);
        }

        .btn-portal:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .features {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .feature-item i {
            color: #10b981;
            margin-right: 4px;
        }
    </style>
</head>

<body>

    <div class="landing-container animate__animated animate__fadeInDown">
        <div class="logo-box">
            <i class="fa-solid fa-industry fa-3x"></i>
        </div>

        <h1>Vellore Spun Pipes</h1>
        <p>Enterprise Resource Planning Portal</p>

        <div class="action-buttons">
            <a href="login.html" class="btn-portal btn-admin animate__animated animate__fadeInLeft animate__delay-1s">
                <i class="fa-solid fa-user-shield"></i> Admin Dashboard
            </a>

            <a href="customer_login.html"
                class="btn-portal btn-customer animate__animated animate__fadeInRight animate__delay-1s">
                <i class="fa-solid fa-user-group"></i> Customer Portal
            </a>
        </div>

        <div class="features animate__animated animate__fadeIn animate__delay-2s">
            <div class="feature-item"><i class="fa-solid fa-circle-check"></i> GST Billing</div>
            <div class="feature-item"><i class="fa-solid fa-circle-check"></i> Inventory</div>
            <div class="feature-item"><i class="fa-solid fa-circle-check"></i> AI Forecast</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="static/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Your existing redirect logic
            if (typeof firebase !== 'undefined' && firebase.auth()) {
                firebase.auth().onAuthStateChanged((user) => {
                    if (user) window.location.href = "dashboard.html";
                });
            }

            const customerUser = localStorage.getItem("vsp_customer");
            if (customerUser) window.location.href = "customer_dashboard.html";
        });
    </script>
</body>

</html>
