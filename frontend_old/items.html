<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Vellore Spun Pipes</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* Professional Theme Overrides */
        :root {
            --primary: #2563eb;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
        }

        /* Professional Form Grid */
        #add-item-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Professional Table Styling */
        .table-responsive {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-top: 20px;
        }

        .party-table {
            width: 100%;
            border-collapse: collapse;
        }

        .party-table th {
            background: #f1f5f9;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 15px;
            text-align: left;
        }

        .party-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        /* Custom Popup Style */
        .toast-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            #add-item-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="toast" class="toast-popup"></div>

    <div class="app-container">
        <div class="sidebar">
            <h2>Vellore<br>Spun Pipes</h2>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="parties.html">Parties</a></li>
                <li><a href="items.html" class="active">Items</a></li>
                <li><a href="sales.html">New Sale</a></li>
                <li><a href="#" onclick="logoutUser()">Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <h3>Inventory Management</h3>
            </div>

            <div class="card">
                <h4 style="margin-bottom: 15px;"><i class="fas fa-plus-circle"></i> Manage Pipe / Item</h4>

                <form id="add-item-form">
                    <input type="hidden" id="item-id">

                    <div class="input-group">
                        <label>Item Description</label>
                        <input type="text" id="item-name" placeholder="e.g. 1200mm NP3 Pipe" required>
                    </div>
                    <div class="input-group">
                        <label>Price (₹)</label>
                        <input type="number" id="item-price" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label>GST %</label>
                        <input type="number" id="item-gst" value="18">
                    </div>
                    <div class="input-group">
                        <label>Stock Qty</label>
                        <input type="number" id="item-stock" placeholder="0" required>
                    </div>

                    <button type="submit" class="btn-primary" style="height: 42px; border-radius: 8px;">
                        <i class="fas fa-save"></i> Save Item
                    </button>
                </form>
            </div>

            <div class="card">
                <div class="top-controls"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3><i class="fas fa-boxes"></i> Current Inventory</h3>
                    <input type="text" id="item-search" placeholder="🔍 Search pipes..." onkeyup="UI.filterItems()"
                        style="width: 250px; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
                </div>

                <div class="table-responsive">
                    <table class="party-table">
                        <thead>
                            <tr>
                                <th style="min-width: 250px;">Item Description</th>
                                <th>Price</th>
                                <th>GST</th>
                                <th>Stock Status</th>
                                <th style="min-width: 120px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="items-table-body">
                            <tr>
                                <td colspan="5">Loading inventory...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="static/js/api.js"></script>
    <script src="static/js/auth.js"></script>
    <script src="static/js/ui.js"></script>

    <script>
        checkAuth();

        // --- Preprocessing & Professional Popups ---
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981';

            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        document.getElementById('add-item-form').addEventListener('submit', function (e) {
            const nameInput = document.getElementById('item-name');

            // 1. Preprocessing: Clean name (Trim spaces & Capitalize first letter)
            const cleanedName = nameInput.value.trim().replace(/\s+/g, ' ');
            nameInput.value = cleanedName;

            // 2. Duplicate Check
            const existingRows = document.querySelectorAll('#items-table-body tr');
            let isDuplicate = false;

            // Skip check if we are EDITING an existing item (item-id is not empty)
            if (!document.getElementById('item-id').value) {
                existingRows.forEach(row => {
                    const existingName = row.cells[0]?.innerText.split('SKU:')[0].trim();
                    if (existingName?.toLowerCase() === cleanedName.toLowerCase()) {
                        isDuplicate = true;
                    }
                });
            }

            if (isDuplicate) {
                e.preventDefault();
                e.stopImmediatePropagation(); // Prevents your ui.js from saving
                showToast("⚠️ This item already exists in inventory!", 'error');
                return false;
            }
        });
    </script>

</body>

</html>
