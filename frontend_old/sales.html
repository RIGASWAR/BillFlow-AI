<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sale | Vellore Spun Pipes</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2563eb;
            --dark-slate: #1e293b;
            --light-bg: #f8fafc;
            --border-color: #e2e8f0;
            --success-green: #059669;
            --error-red: #ef4444;
            --estimate-purple: #7c3aed;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-slate);
            font-family: 'Inter', sans-serif;
        }

        .sales-container {
            max-width: 1100px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Professional Document Toggle */
        .type-toggle-bar {
            display: flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 10px;
            width: fit-content;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .type-btn.active-inv {
            background: var(--primary-blue);
            color: white;
        }

        .type-btn.active-est {
            background: var(--estimate-purple);
            color: white;
        }

        .type-btn:not(.active-inv):not(.active-est) {
            color: #64748b;
            background: transparent;
        }

        /* Confirmation Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .ui-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 24px;
            margin-bottom: 24px;
            transition: 0.2s;
        }

        .section-header {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark-slate);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .bill-table th {
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
            padding: 12px;
            border-bottom: 2px solid var(--border-color);
            text-align: left;
        }

        .bill-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .totals-card {
            background: #1e293b;
            color: white;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
        }

        .totals-row.grand {
            border-top: 1px solid #334155;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .btn-action {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .btn-save {
            background: var(--success-green);
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
            height: 50px;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: var(--error-red);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalIcon" style="font-size: 50px; margin-bottom: 15px;"></div>
            <h3 id="modalTitle" style="margin-bottom: 10px;">Confirm Action</h3>
            <p id="modalDesc" style="color: #64748b; margin-bottom: 25px; line-height: 1.5;"></p>
            <div style="display: flex; gap: 12px;">
                <button onclick="closeConfirmModal()"
                    style="flex: 1; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; background: white; cursor: pointer;">Cancel</button>
                <button id="modalConfirmBtn"
                    style="flex: 1; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer;"></button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <h2>Vellore<br>Spun Pipes</h2>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="parties.html">Parties</a></li>
                <li><a href="items.html">Items</a></li>
                <li><a href="sales.html" class="active">New Sale</a></li>
                <li><a href="#" onclick="logoutUser()">Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <h3><i class="fas fa-file-invoice"></i> <span id="page-title">Create Tax Invoice</span></h3>
                <div class="type-toggle-bar">
                    <button id="type-inv" class="type-btn active-inv" onclick="toggleDoc('Tax Invoice')">TAX
                        INVOICE</button>
                    <button id="type-est" class="type-btn" onclick="toggleDoc('Estimation')">ESTIMATION</button>
                </div>
            </div>

            <div class="sales-container">
                <div class="ui-card">
                    <div class="section-header"><i class="fas fa-user-tie"></i> Customer Information</div>
                    <div class="input-group-row" style="display: flex; gap: 12px;">
                        <select id="party-select"
                            style="flex: 1; height: 42px; border-radius: 8px; border: 1px solid #cbd5e1;">
                            <option value="">-- Choose a Customer --</option>
                        </select>
                    </div>
                </div>

                <div class="ui-card">
                    <div class="section-header"><i class="fas fa-boxes"></i> Billing Details</div>
                    <div style="display:flex; gap:12px; margin-bottom: 20px;">
                        <select id="item-select" onchange="handleItemSelect()"
                            style="flex: 3; height: 42px; border-radius: 8px; border: 1px solid #cbd5e1;">
                            <option value="">-- Search Product --</option>
                        </select>
                        <input type="number" id="item-qty" value="1" min="1"
                            style="flex: 1; max-width: 100px; height: 42px; border-radius: 8px; border: 1px solid #cbd5e1; padding: 0 10px;">
                        <button class="btn-action" onclick="addManualItem()">Add Item</button>
                    </div>

                    <div id="rec-box"
                        style="display:none; background:#eff6ff; border:2px dashed #3b82f6; border-radius:12px; padding:15px; margin:15px 0;">
                        <div style="font-size: 13px; font-weight: 700; color: #1e40af; margin-bottom: 10px;">
                            Suggestions:</div>
                        <div id="rec-list"></div>
                    </div>

                    <table class="bill-table" style="width:100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th>Item Description</th>
                                <th style="text-align:center;">Qty</th>
                                <th>Unit Price</th>
                                <th>Total Amount</th>
                                <th width="40"></th>
                            </tr>
                        </thead>
                        <tbody id="bill-table-body"></tbody>
                    </table>
                </div>

                <div class="totals-section" style="display: flex; justify-content: flex-end;">
                    <div class="totals-card">
                        <div class="totals-row"
                            style="display:flex; justify-content:space-between; margin-bottom:8px; color:#94a3b8;">
                            <span>Subtotal</span><span>₹ <span id="subtotal">0.00</span></span>
                        </div>
                        <div class="totals-row"
                            style="display:flex; justify-content:space-between; margin-bottom:8px; color:#94a3b8;">
                            <span>CGST (9%)</span><span>₹ <span id="cgst">0.00</span></span>
                        </div>
                        <div class="totals-row"
                            style="display:flex; justify-content:space-between; margin-bottom:8px; color:#94a3b8;">
                            <span>SGST (9%)</span><span>₹ <span id="sgst">0.00</span></span>
                        </div>
                        <div class="totals-row grand" style="display:flex; justify-content:space-between;"><span>Grand
                                Total</span><span>₹ <span id="grand-total">0.00</span></span></div>

                        <button class="btn-action btn-save" id="main-save-btn" onclick="openConfirmModal()">
                            <i class="fas fa-save"></i> Save & Generate Tax Invoice
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="static/js/api.js"></script>
    <script src="static/js/auth.js"></script>

    <script>
        let allItems = [];
        let currentBillItems = [];
        let currentDocType = 'Tax Invoice';

        // Toggle Logic
        function toggleDoc(type) {
            currentDocType = type;
            const btnInv = document.getElementById('type-inv');
            const btnEst = document.getElementById('type-est');
            const saveBtn = document.getElementById('main-save-btn');
            const pageTitle = document.getElementById('page-title');

            if (type === 'Tax Invoice') {
                btnInv.className = 'type-btn active-inv';
                btnEst.className = 'type-btn';
                saveBtn.style.background = 'var(--success-green)';
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Save & Generate Tax Invoice';
                pageTitle.innerText = "Create Tax Invoice";
            } else {
                btnInv.className = 'type-btn';
                btnEst.className = 'type-btn active-est';
                saveBtn.style.background = 'var(--estimate-purple)';
                saveBtn.innerHTML = '<i class="fas fa-file-invoice"></i> Save & Generate Estimation';
                pageTitle.innerText = "Create Estimation Bill";
            }
        }

        // Popup Logic
        function openConfirmModal() {
            const partyName = document.getElementById("party-select").value;
            if (!partyName || currentBillItems.length === 0) {
                showNotification("Please select a customer and add items first.");
                return;
            }

            const modal = document.getElementById('confirmModal');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const icon = document.getElementById('modalIcon');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            title.innerText = `Generate ${currentDocType}?`;
            desc.innerText = `You are about to save this ${currentDocType.toLowerCase()} for ${partyName}. The total amount is ₹${document.getElementById('grand-total').innerText}.`;

            if (currentDocType === 'Tax Invoice') {
                icon.innerHTML = '📄'; icon.style.color = 'var(--primary-blue)';
                confirmBtn.style.background = 'var(--success-green)';
            } else {
                icon.innerHTML = '📝'; icon.style.color = 'var(--estimate-purple)';
                confirmBtn.style.background = 'var(--estimate-purple)';
            }

            confirmBtn.innerText = "Confirm & Save";
            confirmBtn.onclick = submitSale;
            modal.style.display = 'flex';
        }

        function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; }

        // --- YOUR ORIGINAL LOGIC MAINTAINED ---
        function showNotification(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (type === 'success') toast.style.background = '#059669';
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            allItems = await API.getItems();
            const itemSelect = document.getElementById("item-select");
            allItems.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.name; opt.textContent = `${item.name} (Stock: ${item.stock})`;
                opt.dataset.price = item.price;
                itemSelect.appendChild(opt);
            });

            const parties = await API.getParties();
            const partySelect = document.getElementById("party-select");
            parties.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.name; opt.textContent = p.name;
                partySelect.appendChild(opt);
            });
        });

        async function handleItemSelect() {
            const itemName = document.getElementById("item-select").value;
            const recBox = document.getElementById("rec-box");
            const recList = document.getElementById("rec-list");
            if (!itemName) { recBox.style.display = "none"; return; }

            const response = await fetch(`${API_BASE_URL}/recommend`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ item_name: itemName })
            });
            const data = await response.json();
            recList.innerHTML = "";
            let found = false;
            if (data.recommendations) {
                data.recommendations.forEach(rec => {
                    const actual = allItems.find(i => i.name.includes(rec.name.trim()));
                    if (actual) {
                        found = true;
                        const btn = document.createElement("button");
                        btn.innerHTML = `+ ${actual.name}`;
                        btn.style = "background:white; border:1px solid #3b82f6; color:#2563eb; padding:5px 10px; border-radius:20px; margin:3px; cursor:pointer; font-size:11px;";
                        btn.onclick = () => addItemToTable(actual.name, actual.price, 1);
                        recList.appendChild(btn);
                    }
                });
            }
            recBox.style.display = found ? "block" : "none";
        }

        function addManualItem() {
            const select = document.getElementById("item-select");
            const qty = parseInt(document.getElementById("item-qty").value);
            if (!select.value) return showNotification("Select a product.");

            // Validation: Stock Check
            const stockStr = select.options[select.selectedIndex].text.match(/Stock: (\d+)/);
            const availableStock = stockStr ? parseInt(stockStr[1]) : 0;

            if (currentDocType === 'Tax Invoice' && qty > availableStock) {
                return showNotification(`Insufficient Stock! Only ${availableStock} available.`);
            }

            const price = parseFloat(select.options[select.selectedIndex].dataset.price);
            if (qty > 0) addItemToTable(select.value, price, qty, availableStock);
        }

        function addItemToTable(name, price, qty, availableStock = 999999) {
            // Find existing item quantity to ensure we don't exceed stock cumulatively
            const existing = currentBillItems.find(i => i.name === name);
            const currentQty = existing ? existing.qty : 0;
            const newTotalQty = currentQty + qty;

            if (currentDocType === 'Tax Invoice' && newTotalQty > availableStock) {
                return showNotification(`Cannot add. Total quantity (${newTotalQty}) exceeds stock (${availableStock}).`);
            }

            if (existing) {
                existing.qty += qty; existing.total = existing.price * existing.qty;
            } else {
                currentBillItems.push({ name, price, qty, total: price * qty });
            }
            renderTable();
        }

        function removeItem(index) { currentBillItems.splice(index, 1); renderTable(); }

        function renderTable() {
            const tbody = document.getElementById("bill-table-body");
            tbody.innerHTML = "";
            let subtotal = 0;
            currentBillItems.forEach((item, index) => {
                subtotal += item.total;
                tbody.innerHTML += `<tr>
                <td>${item.name}</td>
                <td style="text-align:center;">${item.qty}</td>
                <td>₹${item.price.toLocaleString('en-IN')}</td>
                <td>₹${item.total.toLocaleString('en-IN')}</td>
                <td><i class="fas fa-trash" style="color:red; cursor:pointer;" onclick="removeItem(${index})"></i></td>
            </tr>`;
            });
            const tax = subtotal * 0.09;
            document.getElementById("subtotal").innerText = subtotal.toFixed(2);
            document.getElementById("cgst").innerText = tax.toFixed(2);
            document.getElementById("sgst").innerText = tax.toFixed(2);
            document.getElementById("grand-total").innerText = (subtotal + (tax * 2)).toFixed(2);
        }

        async function submitSale() {
            closeConfirmModal();
            const saleData = {
                party_name: document.getElementById("party-select").value,
                items: currentBillItems,
                total: parseFloat(document.getElementById("grand-total").innerText),
                doc_type: currentDocType,
                status: currentDocType === 'Estimation' ? "Estimation" : "Completed"
            };

            const btn = document.getElementById("main-save-btn");
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Saving...";
            btn.disabled = true;

            const result = await API.saveSale(saleData);
            if (result.success) {
                showNotification(`${currentDocType} Saved!`, "success");
                setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
            } else {
                showNotification(result.error || "Error saving.", "error");
                btn.disabled = false;
                // Restore button text
                btn.innerHTML = currentDocType === 'Tax Invoice' ?
                    '<i class="fas fa-save"></i> Save & Generate Tax Invoice' :
                    '<i class="fas fa-file-invoice"></i> Save & Generate Estimation';
            }
        }
    </script>

</body>

</html>
